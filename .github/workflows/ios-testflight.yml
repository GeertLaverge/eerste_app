name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Welke iOS-build wil je maken?'
        required: true
        default: normaal
        type: choice
        options:
          - normaal
          - eigenaar
      build_number:
        description: 'Nieuw uniek TestFlight-buildnummer, hoger dan het vorige'
        required: true
        type: string

jobs:
  testflight:
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Select latest installed Xcode 26
        shell: bash
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)

          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::Er werd geen geïnstalleerde Xcode 26-versie gevonden op de macOS 15-runner."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Geselecteerde Xcode: $XCODE_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Controleer buildtype en buildnummer
        shell: bash
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          BUILD_NUMBER="${{ inputs.build_number }}"

          if [[ "$BUILD_TYPE" != "normaal" ]]; then
            echo "::error::Deze afzonderlijke iPhone-branch ondersteunt uitsluitend normale builds."
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Het buildnummer moet uitsluitend uit cijfers bestaan."
            exit 1
          fi

          if [[ "$BUILD_TYPE" == "eigenaar" && $((BUILD_NUMBER % 2)) -ne 0 ]]; then
            echo "::error::Een eigenaarbuild moet een EVEN buildnummer gebruiken."
            exit 1
          fi

          if [[ "$BUILD_TYPE" == "normaal" && $((BUILD_NUMBER % 2)) -ne 1 ]]; then
            echo "::error::Een normale build moet een ONEVEN buildnummer gebruiken."
            exit 1
          fi

          echo "Buildtype: $BUILD_TYPE"
          echo "Buildnummer: $BUILD_NUMBER"

      - name: Flutter pub get
        run: flutter pub get

      - name: Controleer compacte iPhone entrypoint
        shell: bash
        run: |
          test -f lib/main_iphone.dart
          test -f lib/mobiel/thimaco_iphone_magazijn.dart
          grep -q 'ThimacoIphoneApp' lib/main_iphone.dart

      - name: Analyze alleen de compacte iPhone
        run: flutter analyze lib/main_iphone.dart --no-fatal-infos --no-fatal-warnings

      - name: Create App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s" "${{ secrets.APPSTORE_PRIVATE_KEY }}" \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Install signing certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"

          printf "%s" "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}" \
            | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" \
            "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain \
            -p "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf "%s" "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" \
            | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/thimaco.mobileprovision

      # Gewone personeelsbuild: altijd handmatig gestart.
      # ONEVEN buildnummers zijn gereserveerd voor normale builds.
      - name: Build normal iOS manually
        if: ${{ inputs.build_type == 'normaal' }}
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --target=lib/main_iphone.dart \
            --build-number="${{ inputs.build_number }}"
          grep -F 'FLUTTER_TARGET=lib/main_iphone.dart' ios/Flutter/Generated.xcconfig

      - name: Archive signed iOS app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM=D788LU8M3B \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            FLUTTER_TARGET=lib/main_iphone.dart

      - name: Check archive entitlements
        run: |
          codesign -d --entitlements :- \
            build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Check entitlements after export
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -print -quit)

          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::Er werd geen IPA-bestand gevonden."
            exit 1
          fi

          rm -rf build/ios/check
          mkdir -p build/ios/check
          unzip -q "$IPA_PATH" -d build/ios/check
          codesign -d --entitlements :- build/ios/check/Payload/Runner.app

      # Alleen de gewone build wordt als tijdelijk GitHub-artifact bewaard.
      - name: Upload normal IPA artifact
        if: ${{ inputs.build_type == 'normaal' }}
        uses: actions/upload-artifact@v4
        with:
          name: thimaco-iphone-compact-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Samenvatting compacte iPhone TestFlight
        if: always()
        shell: bash
        run: |
          {
            echo "### Thimaco compacte iPhone-app"
            echo ""
            echo "- Entry point: lib/main_iphone.dart"
            echo "- Alleen normale iPhone-build, geen financiele eigenaarbuild"
            echo "- Buildnummer: ${{ inputs.build_number }}"
            echo "- Bestaande bundle-ID: be.thimaco.app"
            echo "- Deze build vervangt de bestaande TestFlight-variant bij installatie"
          } >> "$GITHUB_STEP_SUMMARY"
